name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/init@main
        with:
          yaml-paths: '.helm'

  build:
    runs-on: ubuntu-latest
    needs: init
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/build@main
        with:
          java-version: '21'

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/image@main
        with:
          image-registry: 'local'
          image-name: 'helloworld-api'
          image-tag: ${{ github.sha }}
          push: 'false'

  scan:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/scan/image@main
        with:
          image-ref: 'local/helloworld-api:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'