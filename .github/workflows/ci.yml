name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/init@main
        with:
          yaml-paths: '.'

  build:
    runs-on: ubuntu-latest
    needs: init
    steps:
      - uses: actions/checkout@v4
      - uses: akhan90/ci-cd-library/.github/actions/build@main
        with:
          java-version: '21'
